<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agent Support - MyMarket Uganda</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    .support-wrap {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .support-card {
      background: #fff;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .support-card h1 {
      margin-top: 0;
    }

    .support-note {
      background: #e7f1ff;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="support-wrap">

  <div class="support-card">

    <h1>Agent Support</h1>

    <div class="support-note">
      <strong>Thanks for contacting Agent Support.</strong>
      <br><br>
      Submit your training complaint or request below.
      Your request will appear in the administrator/support interface.
    </div>

    <form id="supportForm">

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Your name or username"
        required
      >

      <label for="complaint">
        Complaint / Support Request
      </label>

      <textarea
        id="complaint"
        placeholder="Example: Negative at 39/40: -5,000 UGX"
        required
      ></textarea>

      <button
        id="submitButton"
        type="submit"
      >
        SUBMIT SUPPORT REQUEST
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <a
      class="back"
      href="/training.html"
    >
      ← Back to 40/40 Training
    </a>

  </div>

</div>

<script>

function getUser() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "mymarket_user"
      ) || "null"
    );

  } catch (error) {

    return null;

  }

}


const user = getUser();

if (user) {

  document.getElementById(
    "username"
  ).value =
    user.name ||
    user.email ||
    "";

}


document.getElementById(
  "supportForm"
).addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const username =
      document.getElementById(
        "username"
      ).value.trim();

    const complaint =
      document.getElementById(
        "complaint"
      ).value.trim();

    const button =
      document.getElementById(
        "submitButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    if (!username || !complaint) {

      showMessage(
        "Please enter your username and complaint.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "SUBMITTING...";


    try {

      const response =
        await fetch(
          "/api/training/support",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              userId:
                user
                  ? user.id
                  : "",

              username,

              complaint

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to submit support request."
        );

      }


      showMessage(
        data.message ||
        "Support request submitted successfully.",
        "success"
      );


      document.getElementById(
        "complaint"
      ).value = "";


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Unable to connect to the server.",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "SUBMIT SUPPORT REQUEST";

    }

  }
);


function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}

</script>

</body>
  </html>
