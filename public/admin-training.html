<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyMarket - Training Admin</title>

<link rel="stylesheet" href="/styles.css">

<style>
.admin-wrap{
  max-width:800px;
  margin:25px auto;
  padding:20px;
}

.admin-card{
  background:#fff;
  padding:20px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.warning{
  background:#fff3cd;
  border:1px solid #ffc107;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:7px;
}

button{
  cursor:pointer;
  border:none;
  border-radius:8px;
  padding:12px;
  font-weight:bold;
}

.save-btn{
  margin-top:20px;
  width:100%;
  background:#198754;
  color:white;
}

.load-btn{
  width:100%;
  background:#0d6efd;
  color:white;
}

.clear-btn{
  width:100%;
  background:#198754;
  color:white;
  margin-top:10px;
}

.product-row{
  margin-bottom:10px;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

#trainees{
  margin-top:15px;
}
</style>

</head>

<body>

<div class="admin-wrap">

<h1>40/40 Training Admin</h1>

<div class="warning">
⚠️ <strong>TRAINING SIMULATION</strong><br>
These settings control demo values only.
This page does not process real deposits or withdrawals.
</div>

<div class="admin-card">

<h2>Training Settings</h2>

<label>Starting Demo Balance</label>
<input id="startingBalance" type="number">

<label>Negative Task Number</label>
<input id="negativeTask" type="number">

<label>Negative Demo Balance</label>
<input id="negativeBalance" type="number">

<label>Simulated Deposit</label>
<input id="demoDeposit" type="number">

<label>Commission Per Task</label>
<input id="commissionPerTask" type="number">

</div>

<div class="admin-card">

<h2>40 Training Products</h2>

<div id="products"></div>

</div>

<button class="save-btn" onclick="saveSettings()">
SAVE TRAINING SETTINGS
</button>

<a href="/training.html"
style="display:block;text-align:center;margin-top:15px;font-weight:bold;">
🎓 OPEN TRAINEE TRAINING
</a>

<div class="admin-card">

<h2>👤 Trainee Clearance</h2>

<p>
Trainees who reach a negative demo balance will appear here.
</p>

<button class="load-btn" onclick="loadTrainees()">
LOAD TRAINEES
</button>

<div id="trainees"></div>

</div>

<div id="message"></div>
