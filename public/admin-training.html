<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyMarket - Training Admin</title>

<link rel="stylesheet" href="/styles.css">

<style>
.admin-wrap{
  max-width:800px;
  margin:25px auto;
  padding:20px;
}

.admin-card{
  background:#fff;
  padding:20px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.warning{
  background:#fff3cd;
  border:1px solid #ffc107;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:7px;
}

button{
  cursor:pointer;
  border:none;
  border-radius:8px;
  padding:12px;
  font-weight:bold;
}

.save-btn{
  margin-top:20px;
  width:100%;
  background:#198754;
  color:white;
}

.load-btn{
  width:100%;
  background:#0d6efd;
  color:white;
}

.clear-btn{
  width:100%;
  background:#198754;
  color:white;
  margin-top:10px;
}

.product-row{
  margin-bottom:10px;
}

#message{
  margin-top:15px;
  font-weight:bold;
}

#trainees{
  margin-top:15px;
}
</style>

</head>

<body>

<div class="admin-wrap">

<h1>40/40 Training Admin</h1>

<div class="warning">
⚠️ <strong>TRAINING SIMULATION</strong><br>
These settings control demo values only.
This page does not process real deposits or withdrawals.
</div>

<div class="admin-card">

<h2>Training Settings</h2>

<label>Starting Demo Balance</label>
<input id="startingBalance" type="number">

<label>Negative Task Number</label>
<input id="negativeTask" type="number">

<label>Negative Demo Balance</label>
<input id="negativeBalance" type="number">

<label>Simulated Deposit</label>
<input id="demoDeposit" type="number">

<label>Commission Per Task</label>
<input id="commissionPerTask" type="number">

</div>

<div class="admin-card">

<h2>40 Training Products</h2>

<div id="products"></div>

</div>

<button class="save-btn" onclick="saveSettings()">
SAVE TRAINING SETTINGS
</button>

<a href="/training.html"
style="display:block;text-align:center;margin-top:15px;font-weight:bold;">
🎓 OPEN TRAINEE TRAINING
</a>

<div class="admin-card">

<h2>👤 Trainee Clearance</h2>

<p>
Trainees who reach a negative demo balance will appear here.
</p>

<button class="load-btn" onclick="loadTrainees()">
LOAD TRAINEES
</button>

<div id="trainees"></div>

</div>

<div id="message"></div>
<script>

function getAdmin(){

  try{

    return JSON.parse(
      localStorage.getItem("mymarket_user") || "null"
    );

  }catch(error){

    return null;

  }

}


async function loadSettings(){

  try{

    const response =
      await fetch("/api/training/settings");

    const data =
      await response.json();

    if(!response.ok){

      document.getElementById("message").textContent =
        data.error || "Unable to load settings.";

      return;
    }

    const t = data.training;

    document.getElementById("startingBalance").value =
      t.startingBalance || 0;

    document.getElementById("negativeTask").value =
      t.negativeTask || 39;

    document.getElementById("negativeBalance").value =
      t.negativeBalance || 0;

    document.getElementById("demoDeposit").value =
      t.demoDeposit || 0;

    document.getElementById("commissionPerTask").value =
      t.commissionPerTask || 2500;


    const container =
      document.getElementById("products");

    container.innerHTML = "";


    (t.products || []).forEach(
      function(product,index){

        const row =
          document.createElement("div");

        row.className =
          "product-row";

        row.innerHTML =

          "<label>Product " +
          (index + 1) +
          "</label>" +

          "<input class='product-input' " +
          "value='" +
          String(product)
            .replace(/'/g,"&#039;") +
          "'>";

        container.appendChild(row);

      }
    );

  }catch(error){

    console.error(error);

    document.getElementById("message").textContent =
      "Unable to load training settings.";

  }

}


async function saveSettings(){

  const productInputs =
    Array.from(
      document.querySelectorAll(".product-input")
    );


  const products =
    productInputs.map(
      function(input){
        return input.value.trim();
      }
    );


  if(products.length !== 40){

    document.getElementById("message").textContent =
      "You must have exactly 40 products.";

    return;

  }


  const settings = {

    startingBalance:
      Number(
        document.getElementById(
          "startingBalance"
        ).value
      ),

    negativeTask:
      Number(
        document.getElementById(
          "negativeTask"
        ).value
      ),

    negativeBalance:
      Number(
        document.getElementById(
          "negativeBalance"
        ).value
      ),

    demoDeposit:
      Number(
        document.getElementById(
          "demoDeposit"
        ).value
      ),

    commissionPerTask:
      Number(
        document.getElementById(
          "commissionPerTask"
        ).value
      ),

    products: products

  };


  try{

    const response =
      await fetch(
        "/api/training/settings",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(settings)
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      document.getElementById("message").textContent =
        "❌ " +
        (data.error || "Save failed.");

      return;

    }


    document.getElementById("message").textContent =
      "✅ Training settings saved successfully.";

  }catch(error){

    console.error(error);

    document.getElementById("message").textContent =
      "❌ Unable to save settings.";

  }

}async function loadTrainees(){

  const container =
    document.getElementById("trainees");

  container.innerHTML =
    "<p>Loading trainees...</p>";

  const admin =
    getAdmin();

  if(!admin || admin.role !== "admin"){

    container.innerHTML =
      "<p>❌ Please log in as administrator first.</p>";

    return;

  }


  try{

    const response =
      await fetch(
        "/api/training/admin-trainees?adminEmail=" +
        encodeURIComponent(admin.email)
      );


    const data =
      await response.json();


    if(!response.ok){

      container.innerHTML =
        "<p>❌ " +
        (data.error || "Unable to load trainees.") +
        "</p>";

      return;

    }


    if(
      !data.trainees ||
      data.trainees.length === 0
    ){

      container.innerHTML =
        "<p>No trainee records found.</p>";

      return;

    }


    container.innerHTML = "";


    data.trainees.forEach(
      function(t){

        const card =
          document.createElement("div");

        card.className =
          "admin-card";


        card.innerHTML =

          "<h3>👤 Trainee</h3>" +

          "<p><strong>User ID:</strong> " +
          t.userId +
          "</p>" +

          "<p><strong>Progress:</strong> " +
          Number(t.progress || 0) +
          "/40</p>" +

          "<p><strong>Demo Balance:</strong> UGX " +
          Number(t.balance || 0)
            .toLocaleString() +
          "</p>" +

          "<p><strong>Negative Amount:</strong> UGX " +
          Number(t.negativeAmount || 0)
            .toLocaleString() +
          "</p>" +

          "<p><strong>Deposit Required:</strong> UGX " +
          Number(t.depositRequired || 0)
            .toLocaleString() +
          "</p>" +

          "<p><strong>Status:</strong> " +
          t.status +
          "</p>";


        if(
          t.status ===
          "waiting_admin"
        ){

          const button =
            document.createElement("button");

          button.className =
            "clear-btn";

          button.textContent =
            "CLEAR DEMO REQUIREMENT";


          button.onclick =
            function(){

              clearTrainee(
                t.userId
              );

            };


          card.appendChild(button);

        }


        container.appendChild(card);

      }
    );


  }catch(error){

    console.error(error);

    container.innerHTML =
      "<p>❌ Unable to connect to training server.</p>";

  }

}


async function clearTrainee(userId){

  const demoBalance =
    prompt(
      "Enter DEMO balance after clearance:",
      "50000"
    );


  if(demoBalance === null)
    return;


  const amount =
    Number(demoBalance);


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    alert(
      "Enter a valid demo balance greater than zero."
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/training/admin-clear",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              userId:userId,
              demoBalance:amount
            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      alert(
        data.error ||
        "Clearance failed."
      );

      return;

    }


    alert(
      "✅ Demo requirement cleared."
    );


    loadTrainees();


  }catch(error){

    console.error(error);

    alert(
      "Unable to connect to training server."
    );

  }

}


loadSettings();

</script>

</body>
</html>
