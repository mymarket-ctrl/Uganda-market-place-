<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Agent Support - MyMarket Uganda</title>

<link
  rel="stylesheet"
  href="/styles.css"
>

<style>

.support-wrap {
  max-width: 650px;
  margin: 30px auto;
  padding: 20px;
}

.support-card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.support-card h1 {
  margin-top: 0;
}

.support-info {
  background: #e7f1ff;
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

.form-group textarea {
  min-height: 130px;
  resize: vertical;
}

.submit-btn {
  width: 100%;
  border: none;
  padding: 13px;
  border-radius: 8px;
  background: #0d6efd;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.message.success {
  display: block;
  background: #d1e7dd;
  color: #0f5132;
}

.message.error {
  display: block;
  background: #f8d7da;
  color: #842029;
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  text-decoration: none;
  font-weight: bold;
  color: #0d6efd;
}

</style>

</head>

<body>

<div class="support-wrap">

  <div class="support-card">

    <h1>Agent Support</h1>

    <div class="support-info">

      Thanks for contacting Agent Support.

      <br><br>

      Please describe the issue you are experiencing.
      Your request will be sent to the administrator/support
      side for review.

    </div>


    <form id="supportForm">


      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Your username"
          required
        >

      </div>


      <div class="form-group">

        <label for="complaint">
          Complaint
        </label>

        <textarea
          id="complaint"
          name="complaint"
          placeholder="Describe your issue..."
          required
        ></textarea>

      </div>


      <button
        type="submit"
        id="submitButton"
        class="submit-btn"
      >

        SUBMIT SUPPORT REQUEST

      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>


    <a
      href="/training.html"
      class="back-link"
    >

      ← Back to Training

    </a>

  </div>

</div>


<script>

const form =
  document.getElementById(
    "supportForm"
  );

const usernameInput =
  document.getElementById(
    "username"
  );

const complaintInput =
  document.getElementById(
    "complaint"
  );

const submitButton =
  document.getElementById(
    "submitButton"
  );

const message =
  document.getElementById(
    "message"
  );


/*
=========================================================
GET LOGGED-IN USER
=========================================================
*/

function getUser() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "mymarket_user"
      ) || "null"
    );

  } catch (error) {

    return null;

  }

}


/*
=========================================================
LOAD USER INFORMATION
=========================================================
*/

function loadUser() {

  const user =
    getUser();

  if (!user) {
    return;
  }

  usernameInput.value =
    user.name ||
    user.email ||
    "";

}


/*
=========================================================
SHOW MESSAGE
=========================================================
*/

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}


/*
=========================================================
SUBMIT SUPPORT REQUEST
=========================================================
*/

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const user =
      getUser();


    const username =
      usernameInput.value
        .trim();

    const complaint =
      complaintInput.value
        .trim();


    if (!username) {

      showMessage(
        "Please enter your username.",
        "error"
      );

      return;
    }


    if (!complaint) {

      showMessage(
        "Please enter your complaint.",
        "error"
      );

      return;
    }


    submitButton.disabled =
      true;

    submitButton.textContent =
      "SUBMITTING...";


    try {

      const response =
        await fetch(
          "/api/training/support",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              userId:
                user
                  ? user.id
                  : "",

              username,

              complaint

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          data.error ||
          "Unable to submit support request.",
          "error"
        );

        return;
      }


      showMessage(
        "Thanks for contacting Agent Support. Your request has been submitted successfully.",
        "success"
      );


      complaintInput.value =
        "";


    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to connect to the support server.",
        "error"
      );


    } finally {

      submitButton.disabled =
        false;

      submitButton.textContent =
        "SUBMIT SUPPORT REQUEST";

    }

  }
);


/*
=========================================================
START
=========================================================
*/

loadUser();

</script>

</body>
  </html>
